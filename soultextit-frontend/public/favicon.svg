<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the middle hexagon -->
    <linearGradient id="purplePinkGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#9F5DE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E25DA9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Hexagon -->
  <polygon points="50,2 91.6,26 91.6,74 50,98 8.4,74 8.4,26" fill="#120E16" />

  <!-- Purple/Pink Hexagon with Glow -->
  <polygon points="50,25 71.6,37.5 71.6,62.5 50,75 28.4,62.5 28.4,37.5" fill="url(#purplePinkGradient)" filter="url(#glow)" />

  <!-- Wireframe / Depth Lines -->
  <g stroke="#C5A046" stroke-width="0.5" opacity="0.6">
    <!-- Outer Border -->
    <polygon points="50,2 91.6,26 91.6,74 50,98 8.4,74 8.4,26" fill="none" />
    <!-- Connecting Lines (3D Effect) -->
    <line x1="50" y1="2" x2="50" y2="25" />
    <line x1="91.6" y1="26" x2="71.6" y2="37.5" />
    <line x1="91.6" y1="74" x2="71.6" y2="62.5" />
    <line x1="50" y1="98" x2="50" y2="75" />
    <line x1="8.4" y1="74" x2="28.4" y2="62.5" />
    <line x1="8.4" y1="26" x2="28.4" y2="37.5" />
  </g>

  <!-- Center Dark Hexagon -->
  <polygon points="50,38 60.4,44 60.4,56 50,62 39.6,56 39.6,44" fill="#24192B" />

  <!-- Small Center Gold Hexagon -->
  <polygon points="50,44 55.2,47 55.2,53 50,56 44.8,53 44.8,47" fill="#D4AF37" />
</svg>
